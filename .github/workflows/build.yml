name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector to run only selected tests'
        required: false
        default: ''

jobs:
  tests:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10'
            continue-on-error: false
          # Release-era (2023-04) CPython on Linux: later security releases changed
          # html.parser's iframe handling, which the iframe tests depend on.
          - platform: ubuntu-22.04
            tox-env: py39
            python-version: '3.9.16'
          - platform: ubuntu-22.04
            tox-env: py310
            python-version: '3.10.11'
          - platform: ubuntu-22.04
            tox-env: py311
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nolxml
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      env:
        PIP_INDEX_URL: 'https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/'
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m pip install -r requirements/tests.txt .
          python -m pytest -v ${{ inputs.test-filter }}
        else
          python -m tox
        fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - name: Package
      run: |
        python -m pip install --index-url 'https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/' --upgrade build hatchling==1.14.0
        python -m build -s -w --no-isolation
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error

  lint:
    if: false
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Lint
      run: |
        python -m tox

  documents:
    if: false
    timeout-minutes: 20
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: documents

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        python -m tox
